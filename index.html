<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحنك لحل الأسس</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #0088cc;
      --text: #ffffff;
      --border: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    h2 { text-align: center; color: var(--accent); margin-top: 0; font-size: 20px; }
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: bold;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }
    button.calc-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid var(--accent);
      word-break: break-all;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ حلال مسائل الأسس الشامل</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('p1', event)">أس مباشر</button>
      <button class="tab-btn" onclick="switchTab('p2', event)">ضرب الأسس</button>
      <button class="tab-btn" onclick="switchTab('p3', event)">قسمة الأسس</button>
      <button class="tab-btn" onclick="switchTab('p4', event)">قوة القوة</button>
      <button class="tab-btn" onclick="switchTab('p5', event)">أس كسر / جذر</button>
    </div>

    <!-- 1. الأس المباشر -->
    <div id="p1" class="panel active">
      <div class="field"><label>الأساس (a):</label><input type="number" id="base1" placeholder="مثال: 2"></div>
      <div class="field"><label>الأس (n):</label><input type="number" id="exp1" placeholder="مثال: -3 أو 5"></div>
      <button class="calc-btn" onclick="calcPower()">حساب aⁿ</button>
      <div class="result-box" id="res1">النتيجة ستظهر هنا...</div>
    </div>

    <!-- 2. ضرب الأسس -->
    <div id="p2" class="panel">
      <div class="field"><label>الأساس المشترك (a):</label><input type="number" id="base2" placeholder="مثال: 3"></div>
      <div class="field"><label>الأس الأول (m):</label><input type="number" id="exp2_1" placeholder="مثال: 4"></div>
      <div class="field"><label>الأس الثاني (n):</label><input type="number" id="exp2_2" placeholder="مثال: 2"></div>
      <button class="calc-btn" onclick="calcMultiply()">حساب aᵐ × aⁿ</button>
      <div class="result-box" id="res2">النتيجة ستظهر هنا...</div>
    </div>

    <!-- 3. قسمة الأسس -->
    <div id="p3" class="panel">
      <div class="field"><label>الأساس المشترك (a):</label><input type="number" id="base3" placeholder="مثال: 5"></div>
      <div class="field"><label>أس البسط (m):</label><input type="number" id="exp3_1" placeholder="مثال: 7"></div>
      <div class="field"><label>أس المقام (n):</label><input type="number" id="exp3_2" placeholder="مثال: 3"></div>
      <button class="calc-btn" onclick="calcDivide()">حساب aᵐ ÷ aⁿ</button>
      <div class="result-box" id="res3">النتيجة ستظهر هنا...</div>
    </div>

    <!-- 4. قوة القوة -->
    <div id="p4" class="panel">
      <div class="field"><label>الأساس (a):</label><input type="number" id="base4" placeholder="مثال: 2"></div>
      <div class="field"><label>الأس الداخلي (m):</label><input type="number" id="exp4_1" placeholder="مثال: 3"></div>
      <div class="field"><label>الأس الخارجي (n):</label><input type="number" id="exp4_2" placeholder="مثال: 4"></div>
      <button class="calc-btn" onclick="calcPowerOfPower()">حساب (aᵐ)ⁿ</button>
      <div class="result-box" id="res4">النتيجة ستظهر هنا...</div>
    </div>

    <!-- 5. الأس الكسري والجذور -->
    <div id="p5" class="panel">
      <div class="field"><label>الأساس (a):</label><input type="number" id="base5" placeholder="مثال: 27"></div>
      <div class="field"><label>البسط - قوة (m):</label><input type="number" id="exp5_m" placeholder="مثال: 2"></div>
      <div class="field"><label>المقام - دليل الجذر (n):</label><input type="number" id="exp5_n" placeholder="مثال: 3"></div>
      <button class="calc-btn" onclick="calcFractional()">حساب aᵐ/ⁿ (ⁿ√aᵐ)</button>
      <div class="result-box" id="res5">النتيجة ستظهر هنا...</div>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    function switchTab(panelId, event) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      event.target.classList.add('active');
    }

    function computePower(b, e) {
      if (b === 0n && e <= 0n) return "خطأ رياضيات (كمية غير معينة)";
      if (e === 0n) return "1";
      if (e > 0n) return (b ** e).toString();
      const posExp = -e;
      const val = b ** posExp;
      return `1 / ${val.toString()} (≈ ${(1 / Number(val)).toFixed(8)})`;
    }

    function calcPower() {
      const b = document.getElementById('base1').value, e = document.getElementById('exp1').value;
      if (!b || !e) return document.getElementById('res1').innerText = "⚠️ أدخل البيانات كاملة";
      document.getElementById('res1').innerHTML = `<b>النتيجة:</b> ${computePower(BigInt(b), BigInt(e))}`;
    }

    function calcMultiply() {
      const b = document.getElementById('base2').value, e1 = document.getElementById('exp2_1').value, e2 = document.getElementById('exp2_2').value;
      if (!b || !e1 || !e2) return document.getElementById('res2').innerText = "⚠️ أدخل البيانات كاملة";
      const totalExp = BigInt(e1) + BigInt(e2);
      document.getElementById('res2').innerHTML = `<b>الصيغة المتبسطة:</b> ${b}<sup>${totalExp}</sup><br><b>النتيجة النهائية:</b> ${computePower(BigInt(b), totalExp)}`;
    }

    function calcDivide() {
      const b = document.getElementById('base3').value, e1 = document.getElementById('exp3_1').value, e2 = document.getElementById('exp3_2').value;
      if (!b || !e1 || !e2) return document.getElementById('res3').innerText = "⚠️ أدخل البيانات كاملة";
      const totalExp = BigInt(e1) - BigInt(e2);
      document.getElementById('res3').innerHTML = `<b>الصيغة المتبسطة:</b> ${b}<sup>${totalExp}</sup><br><b>النتيجة النهائية:</b> ${computePower(BigInt(b), totalExp)}`;
    }

    function calcPowerOfPower() {
      const b = document.getElementById('base4').value, e1 = document.getElementById('exp4_1').value, e2 = document.getElementById('exp4_2').value;
      if (!b || !e1 || !e2) return document.getElementById('res4').innerText = "⚠️ أدخل البيانات كاملة";
      const totalExp = BigInt(e1) * BigInt(e2);
      document.getElementById('res4').innerHTML = `<b>الصيغة المتبسطة:</b> ${b}<sup>${totalExp}</sup><br><b>النتيجة النهائية:</b> ${computePower(BigInt(b), totalExp)}`;
    }

    function calcFractional() {
      const a = parseFloat(document.getElementById('base5').value);
      const m = parseFloat(document.getElementById('exp5_m').value);
      const n = parseFloat(document.getElementById('exp5_n').value);
      if (isNaN(a) || isNaN(m) || isNaN(n) || n === 0) return document.getElementById('res5').innerText = "⚠️ أدخل أرقاماً صحيحة (المقام لا يساوي 0)";
      
      const val = Math.pow(a, m / n);
      document.getElementById('res5').innerHTML = `<b>الصيغة الجذرية:</b> <sup>${n}</sup>√(${a}<sup>${m}</sup>)<br><b>النتيجة النهائية:</b> ${val}`;
    }
  </script>
</body>
</html>
