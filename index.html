<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحنك لحل الأسس والجبر</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #0088cc;
      --text: #ffffff;
      --border: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    h2 { text-align: center; color: var(--accent); margin-top: 0; font-size: 20px; }
    
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: bold;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .field-group {
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .field-group-title { font-size: 13px; color: var(--accent); font-weight: bold; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; }
    .field { flex: 1; margin-bottom: 8px; }
    label { display: block; margin-bottom: 4px; font-size: 12px; }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #161b22;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    button.calc-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .result-box {
      margin-top: 12px;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid var(--accent);
      word-break: break-all;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ المحنك لحل الأسس والجبر</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('p_alg', event)">📐 توزيع الجبر [(aXⁿ)/...]</button>
      <button class="tab-btn" onclick="switchTab('p1', event)">أس مباشر</button>
      <button class="tab-btn" onclick="switchTab('p2', event)">ضرب وقسمة</button>
    </div>

    <!-- تبويب التبسيط الجبري للمسائل المركبة -->
    <div id="p_alg" class="panel active">
      <div class="field-group">
        <div class="field-group-title">البسط: (معامل × X^أس × Y^أس)</div>
        <div class="row">
          <div class="field"><label>المعامل:</label><input type="number" id="num_c" value="10"></div>
          <div class="field"><label>أس X:</label><input type="number" id="num_x" value="3"></div>
          <div class="field"><label>أس Y:</label><input type="number" id="num_y" value="0"></div>
        </div>
      </div>

      <div class="field-group">
        <div class="field-group-title">المقام: (معامل × X^أس × Y^أس)</div>
        <div class="row">
          <div class="field"><label>المعامل:</label><input type="number" id="den_c" value="5"></div>
          <div class="field"><label>أس X:</label><input type="number" id="den_x" value="2"></div>
          <div class="field"><label>أس Y:</label><input type="number" id="den_y" value="3"></div>
        </div>
      </div>

      <div class="field"><label>القوة الشاملة للقوس (N):</label><input type="number" id="outer_p" value="2"></div>

      <button class="calc-btn" onclick="solveAlgebraic()">توزيع الأس وتبسيط المسألة 🚀</button>
      <div class="result-box" id="res_alg">النتيجة وخطوات الحل ستظهر هنا...</div>
    </div>

    <!-- الأس المباشر -->
    <div id="p1" class="panel">
      <div class="field"><label>الأساس (a):</label><input type="number" id="base1" placeholder="مثال: 2"></div>
      <div class="field"><label>الأس (n):</label><input type="number" id="exp1" placeholder="مثال: 5"></div>
      <button class="calc-btn" onclick="calcPower()">حساب aⁿ</button>
      <div class="result-box" id="res1">النتيجة ستظهر هنا...</div>
    </div>

    <!-- ضرب وقسمة -->
    <div id="p2" class="panel">
      <div class="field"><label>الأساس (a):</label><input type="number" id="base2" placeholder="مثال: 3"></div>
      <div class="field"><label>الأس الأول (m):</label><input type="number" id="exp2_1" placeholder="مثال: 4"></div>
      <div class="field"><label>الأس الثاني (n):</label><input type="number" id="exp2_2" placeholder="مثال: 2"></div>
      <button class="calc-btn" onclick="calcMultiply()">حساب الضرب</button>
      <div class="result-box" id="res2">النتيجة ستظهر هنا...</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    function switchTab(panelId, event) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      event.target.classList.add('active');
    }

    // القاسم المشترك الأكبر لتبسيط الأعداد
    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    function solveAlgebraic() {
      const numC = parseFloat(document.getElementById('num_c').value) || 1;
      const numX = parseFloat(document.getElementById('num_x').value) || 0;
      const numY = parseFloat(document.getElementById('num_y').value) || 0;

      const denC = parseFloat(document.getElementById('den_c').value) || 1;
      const denX = parseFloat(document.getElementById('den_x').value) || 0;
      const denY = parseFloat(document.getElementById('den_y').value) || 0;

      const N = parseFloat(document.getElementById('outer_p').value) || 1;

      // 1. توزيع الأس الخارجي
      const newNumC = Math.pow(numC, N);
      const newDenC = Math.pow(denC, N);

      const newNumX = numX * N;
      const newDenX = denX * N;

      const newNumY = numY * N;
      const newDenY = denY * N;

      // 2. تبسيط الأرقام
      const commonGcd = gcd(Math.abs(newNumC), Math.abs(newDenC));
      const finalNumC = newNumC / commonGcd;
      const finalDenC = newDenC / commonGcd;

      // 3. تبسيط المتغيرات (طرح الأسس)
      const diffX = newNumX - newDenX;
      const diffY = newNumY - newDenY;

      // صياغة المخرجات
      let topStr = "";
      let botStr = "";

      if (finalNumC !== 1 || (diffX === 0 && diffY === 0 && finalDenC === 1)) topStr += finalNumC;
      if (diffX > 0) topStr += `X<sup>${diffX}</sup>`;
      if (diffY > 0) topStr += `Y<sup>${diffY}</sup>`;
      if (topStr === "") topStr = "1";

      if (finalDenC !== 1) botStr += finalDenC;
      if (diffX < 0) botStr += `X<sup>${Math.abs(diffX)}</sup>`;
      if (diffY < 0) botStr += `Y<sup>${Math.abs(diffY)}</sup>`;

      let step1 = `<b>1️⃣ خطوة توزيع الأس (${N}):</b><br>
        البسط: (${numC}<sup>${N}</sup>) × X<sup>(${numX}×${N})</sup> × Y<sup>(${numY}×${N})</sup> = ${newNumC} X<sup>${newNumX}</sup> Y<sup>${newNumY}</sup><br>
        المقام: (${denC}<sup>${N}</sup>) × X<sup>(${denX}×${N})</sup> × Y<sup>(${denY}×${N})</sup> = ${newDenC} X<sup>${newDenX}</sup> Y<sup>${newDenY}</sup>`;

      let step2 = `<br><br><b>2️⃣ النتيجة التبسيطية النهائية:</b><br>`;
      if (botStr !== "") {
        step2 += `<div style="text-align:center; margin-top:5px;"><u>${topStr}</u><br>${botStr}</div>`;
      } else {
        step2 += `<div style="text-align:center; margin-top:5px;"><b>${topStr}</b></div>`;
      }

      document.getElementById('res_alg').innerHTML = step1 + step2;
    }

    function calcPower() {
      const b = BigInt(document.getElementById('base1').value), e = BigInt(document.getElementById('exp1').value);
      document.getElementById('res1').innerText = `النتيجة: ${(b ** e).toString()}`;
    }

    function calcMultiply() {
      const b = document.getElementById('base2').value, e1 = BigInt(document.getElementById('exp2_1').value), e2 = BigInt(document.getElementById('exp2_2').value);
      document.getElementById('res2').innerText = `النتيجة: ${b}^${e1 + e2}`;
    }
  </script>
</body>
</html>
