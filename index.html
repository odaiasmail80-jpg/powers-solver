<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلال الأسس الشامل</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162247;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 1.1rem;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>حلال الأسس الشامل</h1>
        
        <div class="input-group">
            <label for="base">الأساس (Base):</label>
            <input type="number" id="base" placeholder="أدخل الاساس">
        </div>

        <div class="input-group">
            <label for="exponent">الأس (Exponent):</label>
            <input type="number" id="exponent" placeholder="أدخل الأس">
        </div>

        <button onclick="calculate()">احسب</button>

        <div class="result" id="result">النتيجة ستظهر هنا</div>
    </div>

    <script>
        function calculate() {
            const base = parseFloat(document.getElementById('base').value);
            const exponent = parseFloat(document.getElementById('exponent').value);
            const resultDiv = document.getElementById('result');

            if (isNaN(base) || isNaN(exponent)) {
                resultDiv.innerHTML = "الرجاء إدخال أرقام صحيحة!";
                return;
            }

            const res = Math.pow(base, exponent);
            resultDiv.innerHTML = `النتيجة: <strong>${res}</strong>`;
        }
    </script>

</body>
</html>
